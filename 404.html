---
title: Page not found
---
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    <style type="text/css" media="screen">
      .not-found {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2em;
        text-align: center;
      }
      .not-found h1 {
        margin: 0 0 0.5em 0;
        font-size: 4em;
        line-height: 1;
        letter-spacing: -1px;
      }
    </style>

    <div id="wrapper">
      <section class="not-found">
        <h1>404</h1>
        <p>The requested page could not be found.</p>
        <a href="{{ '/' | relative_url }}" class="button primary">Back to the gallery</a>
      </section>
    </div>

  </body>

</html>
